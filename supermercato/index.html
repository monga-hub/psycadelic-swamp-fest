<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spesa Pazza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: canvas isometrico a schermo intero, pannelli smussati anni '90 fissati in alto e in basso, finestre centrali */
:root{
  --ink:#0e171b;
  --panel:#2b4552;
  --panel-hi:#6f97a4;
  --panel-lo:#10212a;
  --well:#142a33;
  --cream:#f4ead0;
  --muted:#a9bec4;
  --ochre:#f0b43a;
  --good:#86c95a;
  --bad:#e2583b;
  --sky:#9ed2e6;
  --f-display:'Silkscreen','Courier New',monospace;
  --f-ui:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);overflow:hidden;font-family:var(--f-ui);font-size:15px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#view{position:absolute;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;cursor:default}
#view.building{cursor:crosshair}
.bevel{background:var(--panel);box-shadow:inset 2px 2px 0 var(--panel-hi),inset -2px -2px 0 var(--panel-lo),0 0 0 2px var(--ink)}
.well{background:var(--well);box-shadow:inset 2px 2px 0 var(--panel-lo),inset -2px -2px 0 #3d6070}
.btn{font:inherit;color:var(--cream);background:var(--panel);border:0;border-radius:0;padding:6px 10px;cursor:pointer;
  box-shadow:inset 2px 2px 0 var(--panel-hi),inset -2px -2px 0 var(--panel-lo),0 0 0 1px var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.1}
.btn:hover{background:#335261}
.btn:active,.btn.on{background:var(--well);box-shadow:inset -2px -2px 0 var(--panel-hi),inset 2px 2px 0 var(--panel-lo),0 0 0 1px var(--ink)}
.btn.on{color:var(--ochre)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:#7a5a12;box-shadow:inset 2px 2px 0 #d9a63a,inset -2px -2px 0 #3c2a05,0 0 0 1px var(--ink)}
.btn.primary:hover{background:#8d6a18}
.btn.danger{background:#7a2a1c;box-shadow:inset 2px 2px 0 #c85a43,inset -2px -2px 0 #3a120a,0 0 0 1px var(--ink)}
canvas.ico{width:20px;height:20px;image-rendering:pixelated;flex:none}

/* top bar */
#top{position:absolute;left:0;right:0;top:0;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));padding-top:calc(6px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:5}
.logo{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--ochre);text-shadow:2px 2px 0 #5b3a06;padding:0 6px}
.lcd{font-family:var(--f-display);font-size:14px;padding:5px 9px;color:#bff09a;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.lcd.money{color:var(--ochre);min-width:120px;text-align:right}
.lcd.money.neg{color:var(--bad)}
.rep{display:flex;align-items:center;gap:6px;font-size:13px}
.bar{width:90px;height:12px;position:relative}
.bar>i{position:absolute;left:2px;top:2px;bottom:2px;background:var(--good);width:50%}
.grp{display:flex;gap:3px}
.spacer{flex:1}

/* bottom panel */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.tools{display:flex;gap:4px;flex-wrap:wrap}
#ticker{flex:1 1 260px;min-width:0;text-align:left;justify-content:flex-start;font-size:14px;color:#d8f0c8;overflow:hidden}
#ticker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tray{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin}
.card{font:inherit;color:var(--cream);border:0;cursor:pointer;background:var(--well);padding:4px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:96px;
  box-shadow:inset 2px 2px 0 var(--panel-lo),inset -2px -2px 0 #3d6070}
.card canvas{width:81px;height:69px;image-rendering:pixelated}
.card b{font-weight:600;font-size:13px;white-space:nowrap}
.card small{color:var(--ochre);font-family:var(--f-display);font-size:11px}
.card.on{outline:2px solid var(--ochre);outline-offset:-2px;background:#1d3a46}
.card.cant small{color:var(--bad)}
#hint{position:absolute;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:6px;align-items:center;padding:6px 8px;font-size:13px}

/* info panel */
#info{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:70px;width:270px;max-width:calc(100% - 16px);z-index:6;padding:0 0 8px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#173742;padding:5px 6px 5px 10px;font-family:var(--f-display);font-size:13px;color:var(--ochre);box-shadow:inset 0 -2px 0 var(--panel-lo)}
.x{font:inherit;font-family:var(--f-ui);background:var(--panel);color:var(--cream);border:0;width:26px;height:24px;cursor:pointer;box-shadow:inset 2px 2px 0 var(--panel-hi),inset -2px -2px 0 var(--panel-lo)}
.ibody{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.meter{height:10px;position:relative}
.meter>i{position:absolute;left:2px;top:2px;bottom:2px}
.list{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:2px}
.list li{display:flex;justify-content:space-between;gap:8px}
.ok{color:var(--good)}.ko{color:var(--bad)}.wait{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px}
.portrait{width:48px;height:60px;image-rendering:pixelated;flex:none}

/* windows */
#modalWrap{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:70px 12px 90px;background:rgba(6,12,16,.35)}
.win{width:min(640px,100%);max-height:100%;display:flex;flex-direction:column}
#winBody{overflow:auto;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.win h3{margin:0;font-family:var(--f-display);font-size:14px;color:var(--ochre);letter-spacing:.04em}
.win p{margin:0;line-height:1.45;max-width:62ch}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cand{padding:8px;display:flex;gap:8px;align-items:flex-start}
.cand .meta{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.stars{color:var(--ochre);letter-spacing:1px}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t td,table.t th{padding:4px 6px;text-align:right;border-bottom:1px solid #20414d}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:400}
table.t tr.sum td{color:var(--ochre);font-weight:600;border-bottom:0}
.price-row{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 64px 82px;gap:8px;align-items:center;font-size:14px}
.price-row input{width:100%;accent-color:var(--ochre)}
.price-row .v{font-family:var(--f-display);font-size:12px;color:var(--ochre);text-align:right}
.tagp{font-size:12px;text-align:right}
.ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ad{padding:10px;display:flex;flex-direction:column;gap:6px}
.medals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.medal{padding:10px;display:flex;flex-direction:column;gap:6px}
.medal.won h3{color:var(--good)}
.goalrow{font-size:13px;display:flex;flex-direction:column;gap:2px}
.chart{width:100%;height:170px;image-rendering:auto}
.log{font-size:13px;display:flex;flex-direction:column;gap:3px;max-height:50vh;overflow:auto}
.log .tip{color:#d8f0c8}.log .bad{color:#ffb39f}.log .good{color:#c8f0a8}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.keys kbd{font-family:var(--f-display);font-size:11px;background:var(--well);padding:2px 6px;box-shadow:inset -1px -1px 0 #3d6070}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

@media (max-width:720px){
  html,body{font-size:14px}
  .logo{font-size:14px}
  .lcd{font-size:12px;padding:4px 6px}
  .lcd.money{min-width:0}
  .bar{width:56px}
  .rep .lbl{display:none}
  #info{top:auto;bottom:150px;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;max-height:42vh;overflow:auto}
  .tools .btn .lbl{display:none}
  .price-row{grid-template-columns:1fr 1fr;}
  #ticker{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Vista isometrica del supermercato"></canvas>

  <header id="top" class="bevel">
    <span class="logo">SPESA PAZZA</span>
    <span class="lcd well" id="clock">G1 LUN 07:50</span>
    <span class="lcd well money" id="money">€ 0</span>
    <span class="rep" title="Reputazione del supermercato"><span class="lbl">Reputazione</span><span class="bar well"><i id="repbar"></i></span><b id="repv">50</b></span>
    <span class="lcd well" id="pop" title="Clienti nel negozio">CLIENTI 0</span>
    <span class="spacer"></span>
    <span class="grp" role="group" aria-label="Velocità">
      <button class="btn" data-speed="0" title="Pausa (Spazio)">II</button>
      <button class="btn" data-speed="1" title="Normale (1)">&gt;</button>
      <button class="btn" data-speed="2" title="Veloce (2)">&gt;&gt;</button>
      <button class="btn" data-speed="3" title="Molto veloce (3)">&gt;&gt;&gt;</button>
      <button class="btn" data-speed="4" title="Turbo (4)">&gt;&gt;&gt;&gt;</button>
    </span>
    <span class="grp">
      <button class="btn" id="zoomOut" title="Riduci (-)">−</button>
      <button class="btn" id="zoomIn" title="Ingrandisci (+)">+</button>
      <button class="btn" id="sound" title="Effetti sonori">Audio</button>
    </span>
  </header>

  <aside id="info" class="bevel" hidden>
    <div class="titlebar"><span id="infoTitle">Info</span><button class="x" id="infoClose" aria-label="Chiudi">×</button></div>
    <div class="ibody" id="infoHead"></div>
    <div class="ibody" id="infoLive"></div>
    <div class="acts" id="infoActs"></div>
  </aside>

  <div id="hint" class="bevel" hidden>
    <span id="hintText">Clicca sul pavimento per costruire</span>
    <button class="btn" id="hintRot">Ruota (R)</button>
    <button class="btn" id="hintCancel">Fine (Esc)</button>
  </div>

  <footer id="bottom" class="bevel">
    <div id="tray" hidden></div>
    <div class="row">
      <div class="tools" id="tools">
        <button class="btn" data-cat="rep"><canvas class="ico" data-ico="shelf" width="10" height="10"></canvas><span class="lbl">Reparti</span></button>
        <button class="btn" data-cat="srv"><canvas class="ico" data-ico="till" width="10" height="10"></canvas><span class="lbl">Servizi</span></button>
        <button class="btn" data-cat="dec"><canvas class="ico" data-ico="plant" width="10" height="10"></canvas><span class="lbl">Decori</span></button>
        <button class="btn" data-win="staff"><canvas class="ico" data-ico="staff" width="10" height="10"></canvas><span class="lbl">Personale</span></button>
        <button class="btn" data-win="prices"><canvas class="ico" data-ico="tag" width="10" height="10"></canvas><span class="lbl">Prezzi</span></button>
        <button class="btn" data-win="ads"><canvas class="ico" data-ico="horn" width="10" height="10"></canvas><span class="lbl">Pubblicità</span></button>
        <button class="btn" data-win="bank"><canvas class="ico" data-ico="bank" width="10" height="10"></canvas><span class="lbl">Banca</span></button>
        <button class="btn" data-win="stats"><canvas class="ico" data-ico="chart" width="10" height="10"></canvas><span class="lbl">Statistiche</span></button>
        <button class="btn" data-win="goals"><canvas class="ico" data-ico="medal" width="10" height="10"></canvas><span class="lbl">Obiettivi</span></button>
        <button class="btn" data-win="menu"><canvas class="ico" data-ico="disk" width="10" height="10"></canvas><span class="lbl">Menu</span></button>
      </div>
      <button class="btn well" id="ticker" title="Apri il registro messaggi"><span id="tickerText">Benvenuto!</span></button>
    </div>
  </footer>

  <div id="modalWrap" hidden>
    <div class="win bevel" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="titlebar"><span id="winTitle">Finestra</span><button class="x" id="winClose" aria-label="Chiudi">×</button></div>
      <div id="winBody"></div>
    </div>
  </div>
</div>

<script>
'use strict';
(() => {
// ===================================================================
//  COSTANTI MAPPA
// ===================================================================
const MW = 32, MH = 28;              // dimensioni mappa (tile)
const X0 = 4, Y0 = 3, X1 = 27, Y1 = 19; // perimetro edificio (muri inclusi)

const DOORX = [15, 16];
const T_GRASS = 0, T_FLOOR = 1, T_WALL = 2, T_DOOR = 3, T_PATH = 4, T_ASPH = 5, T_ROAD = 6, T_SPOT = 7, T_DOCK = 8;
const WALKABLE = new Set([T_GRASS, T_FLOOR, T_DOOR, T_PATH, T_ASPH, T_ROAD]);

const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmtE = v => (v < 0 ? '-€ ' : '€ ') + Math.round(Math.abs(v)).toLocaleString('it-IT');
const fmtP = v => '€ ' + v.toFixed(2).replace('.', ',');
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

};
const PROD_KEYS = Object.keys(PRODS);

};

const ROLES = {
  cassiere:     { n: 'Cassiere', pl: 'Cassieri', base: 280, k: 40, sp: 2.2, col: '#c8372d', desc: 'Si mette alla cassa libera e fa pagare i clienti. Più è bravo, più la fila scorre.' },

};

function T(x, y) { return (x < 0 || y < 0 || x >= MW || y >= MH) ? null : grid[y * MW + x]; }
function inBuilding(x, y) { return x > X0 && x < X1 && y > Y0 && y < Y1; }
function buildMap() {
  grid = [];
  const R = mulberry(9137);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    let t = T_GRASS;
    if (x >= X0 && x <= X1 && y >= Y0 && y <= Y1) {
      const edge = x === X0 || x === X1 || y === Y0 || y === Y1;
      t = edge ? T_WALL : T_FLOOR;
      if (y === Y1 && DOORX.includes(x)) t = T_DOOR;
      if (x === X0 && y === DOCKY) t = T_DOCK;
    } else if (x >= X0 - 1 && x <= X1 + 1 && y >= Y0 - 1 && y <= Y1 + 1) t = T_PATH;
    else if (y >= MH - 2) t = T_ROAD;
    else if (y >= Y1 + 2 && x >= X0 - 1 && x <= X1 + 1) {
      t = T_ASPH;
      if ((y === Y1 + 3 || y === Y1 + 5) && !(x >= 13 && x <= 18) && x >= X0 && x <= X1) t = T_SPOT;
    }
    grid.push({ t, walk: WALKABLE.has(t), obj: 0, res: 0, litter: 0, deco: null, cl: 0 });
  }
  // lampioni nel parcheggio
  LAMPS = [[12, Y1 + 3], [19, Y1 + 3], [12, Y1 + 5], [19, Y1 + 5], [X0 - 1, Y1 + 2], [X1 + 1, Y1 + 2]];
  for (const [x, y] of LAMPS) { const t = T(x, y); t.t = T_ASPH; t.deco = 'lamp'; t.walk = false; }
  SPOTS = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) { const t = T(x, y); if (t.t === T_SPOT) { t.walk = false; SPOTS.push({ x, y, col: pick(['#c8372d', '#2f6fb3', '#e8e2d0', '#3f8f4e', '#f0b43a', '#6b4c8a', '#3a3f45']), r: R() }); } }
  SPOTS.sort((a, b) => a.r - b.r);
  // alberi
  for (let y = 0; y < MH - 2; y++) for (let x = 0; x < MW; x++) {
    const t = T(x, y);
    if (t.t === T_GRASS && R() < .22) { t.deco = 'tree'; t.walk = false; t.seed = R(); }
  }
  // banchina di carico: pallet ai lati del punto di ritiro
  for (const dy of [-1, 1]) { const t = T(X0 + 1, DOCKY + dy); t.deco = 'pallet'; t.walk = false; }
  T(X0 + 1, DOCKY).res = -1;
  for (const x of DOORX) T(x, Y1 - 1).res = -1;
}
const DOCK_TILE = [X0 + 1, DOCKY];
const EXITS = [[0, MH - 1], [MW - 1, MH - 2]];
function walkable(x, y) { const t = T(x, y); return !!t && t.walk && !t.obj; }

// ---------- pathfinding A* ----------
const NN = MW * MH;
const G = new Float32Array(NN), CAME = new Int32Array(NN), CLOSED = new Uint8Array(NN);
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
let hI = [], hF = [];
function hpush(i, f) { hI.push(i); hF.push(f); let k = hI.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (hF[p] <= hF[k]) break; [hI[p], hI[k]] = [hI[k], hI[p]]; [hF[p], hF[k]] = [hF[k], hF[p]]; k = p; } }
function hpop() { const top = hI[0]; const li = hI.pop(), lf = hF.pop(); if (hI.length) { hI[0] = li; hF[0] = lf; let k = 0; for (;;) { const l = 2 * k + 1, r = l + 1; let m = k; if (l < hI.length && hF[l] < hF[m]) m = l; if (r < hI.length && hF[r] < hF[m]) m = r; if (m === k) break; [hI[m], hI[k]] = [hI[k], hI[m]]; [hF[m], hF[k]] = [hF[k], hF[m]]; k = m; } } return top; }
function findPath(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) return null;
  const s = sy * MW + sx, t = ty * MW + tx;
  if (s === t) return [];
  G.fill(1e9); CAME.fill(-1); CLOSED.fill(0); hI = []; hF = [];
  G[s] = 0; hpush(s, Math.abs(sx - tx) + Math.abs(sy - ty));
  while (hI.length) {
    const cur = hpop();
    if (cur === t) break;
    if (CLOSED[cur]) continue;
    CLOSED[cur] = 1;
    const cx = cur % MW, cy = (cur / MW) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy;
      if (!walkable(nx, ny)) continue;
      const ni = ny * MW + nx, ng = G[cur] + 1;
      if (ng < G[ni]) { G[ni] = ng; CAME[ni] = cur; hpush(ni, ng + Math.abs(nx - tx) + Math.abs(ny - ty) * 1.001); }
    }
  }
  if (CAME[t] < 0) return null;
  const path = []; let c = t;
  while (c !== s) { path.push([c % MW, (c / MW) | 0]); c = CAME[c]; }
  return path.reverse();
}
function reachFrom(sx, sy, blocked) {
  const vis = new Uint8Array(NN); const q = [sy * MW + sx]; vis[q[0]] = 1;

    const c = q.pop(); const cx = c % MW, cy = (c / MW) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy; const t = T(nx, ny);
      if (!t || !t.walk || t.obj) continue;
      const ni = ny * MW + nx;
      if (vis[ni] || (blocked && blocked.has(ni))) continue;
      if (!inBuilding(nx, ny) && t.t !== T_DOOR) continue;
      vis[ni] = 1; q.push(ni);
    }
  }
  return vis;
}

// ===================================================================
function dims(type, rot) { const d = OBJS[type]; return rot ? [d.h, d.w] : [d.w, d.h]; }
function fpTiles(type, x, y, rot) { const [w, h] = dims(type, rot); const r = []; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) r.push([x + i, y + j]); return r; }
function special(type, x, y) { return type === 'cassa' ? { cashier: [x - 1, y], service: [x + 1, y] } : null; }
function adjTiles(o, list) {
  const own = new Set(o.tiles.map(([x, y]) => y * MW + x)); const r = []; const seen = new Set();
  for (const [x, y] of (list || o.tiles)) for (const [dx, dy] of DIRS) {
    const nx = x + dx, ny = y + dy, k = ny * MW + nx;
    if (own.has(k) || seen.has(k)) continue; seen.add(k);
    const t = T(nx, ny); if (t && t.walk && !t.obj && inBuilding(nx, ny)) r.push([nx, ny]);
  }
  return r;
}
function needsAccess(type) { return OBJS[type].cat !== 'dec'; }

function canPlace(type, x, y, rot) {
  const tiles = fpTiles(type, x, y, rot);
  if (OBJS[type].cost > S.money) return { ok: false, why: 'Fondi insufficienti' };
  for (const [tx, ty] of tiles) {
    const t = T(tx, ty);
    if (!t || t.t !== T_FLOOR || !inBuilding(tx, ty)) return { ok: false, why: 'Fuori dal negozio' };
    if (t.obj) return { ok: false, why: 'Spazio occupato' };
    if (t.res) return { ok: false, why: 'Spazio riservato (passaggio o cassa)' };
  }
  const sp = special(type, x, y);
  if (sp) for (const k of ['cashier', 'service']) {
    const [sx, sy] = sp[k]; const t = T(sx, sy);
    if (!t || t.t !== T_FLOOR || t.obj || (t.res && t.res !== -1) || !inBuilding(sx, sy)) return { ok: false, why: k === 'cashier' ? 'Serve spazio a sinistra per il cassiere' : 'Serve spazio a destra per i clienti' };
  }
  // connettività: nessun oggetto deve restare irraggiungibile
  const blocked = new Set(tiles.map(([a, b]) => b * MW + a));
  const vis = reachFrom(DOORX[0], Y1 - 1, blocked);
  const ok = (a, b) => vis[b * MW + a] === 1;
  if (!ok(...DOCK_TILE)) return { ok: false, why: 'Bloccheresti la banchina di carico' };
  if (!ok(DOORX[1], Y1 - 1)) return { ok: false, why: 'Bloccheresti l\'ingresso' };
  const check = (o) => {
    if (!needsAccess(o.type)) return true;
    if (o.type === 'cassa') return ok(...o.sp.cashier) && ok(...o.sp.service);
    for (const [ax, ay] of adjCandidates(o.tiles)) if (!blocked.has(ay * MW + ax) && ok(ax, ay)) return true;
    return false;
  };
  for (const o of objs) if (!check(o)) return { ok: false, why: 'Bloccheresti l\'accesso a: ' + OBJS[o.type].n };
  if (!check({ type, tiles, sp })) return { ok: false, why: 'Non sarebbe raggiungibile' };
  return { ok: true };
}
function adjCandidates(tiles) {
  const own = new Set(tiles.map(([x, y]) => y * MW + x)); const r = [];
  for (const [x, y] of tiles) for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (!own.has(ny * MW + nx)) r.push([nx, ny]); }
  return r;
}

function placeObj(type, x, y, rot, free) {
  const d = OBJS[type]; const [w, h] = dims(type, rot);
  const o = { id: nextId++, type, x, y, w, h, rot: rot || 0, tiles: fpTiles(type, x, y, rot) };
  if (d.cap) o.stock = d.cap;
  if (type === 'cassa') { o.sp = special(type, x, y); o.queue = []; o.staffId = 0; o.served = 0; o.lane = ++S.laneN; }
  if (type === 'cestino') o.fill = 0;
  if (type === 'divano') o.users = 0;
  o.seed = Math.random();
  objs.push(o); objMap.set(o.id, o);
  for (const [tx, ty] of o.tiles) T(tx, ty).obj = o.id;
  if (o.sp) for (const k of ['cashier', 'service']) T(...o.sp[k]).res = o.id;
  if (!free) spend(d.cost, 'build');
  mapChanged();
  // sposta chi si trova sotto
  for (const p of people) {
    const tx = Math.round(p.x), ty = Math.round(p.y);
    if (T(tx, ty) && T(tx, ty).obj) { const f = nearestFree(tx, ty); if (f) { p.x = f[0]; p.y = f[1]; } if (p.dest) setDest(p, p.dest[0], p.dest[1]); }
  }

}
function nearestFree(x, y) {
  const vis = new Set([y * MW + x]); const q = [[x, y]];
  while (q.length) { const [cx, cy] = q.shift(); if (walkable(cx, cy)) return [cx, cy]; for (const [dx, dy] of DIRS) { const k = (cy + dy) * MW + cx + dx; if (!vis.has(k) && T(cx + dx, cy + dy)) { vis.add(k); q.push([cx + dx, cy + dy]); } } }
  return null;
}
function removeObj(o, refund) {
  for (const [tx, ty] of o.tiles) T(tx, ty).obj = 0;
  if (o.sp) for (const k of ['cashier', 'service']) { const t = T(...o.sp[k]); if (t.res === o.id) t.res = 0; }
  objs.splice(objs.indexOf(o), 1); objMap.delete(o.id);
  if (refund) { const v = Math.round(OBJS[o.type].cost * .5); earn(v, 'sell'); addFloat(o.x, o.y, '+' + fmtE(v), '#f0b43a'); }
  if (o.queue) for (const id of o.queue) { const c = pmap.get(id); if (c) { c.co = 0; c.state = 'toCheckout'; } }
  for (const p of people) {
    if (p.post === o.id) { p.post = 0; p.atPost = false; p.state = 'idle'; }
    if (p.job === o.id) { p.job = 0; p.carry = null; p.state = 'idle'; }
    if (p.tgt === o.id) { p.tgt = 0; if (p.kind === 'cliente') p.state = 'shop'; else p.state = 'idle'; }
    if (p.sofa === o.id) { p.sofa = 0; p.state = 'idle'; }
  }

}
function mapChanged() {
  BYTYPE = {}; SHELVES = {};
  for (const k of Object.keys(OBJS)) BYTYPE[k] = [];
  for (const k of PROD_KEYS) SHELVES[k] = [];
  for (const o of objs) { BYTYPE[o.type].push(o); const p = OBJS[o.type].prod; if (p) SHELVES[p].push(o); }
  // file alle casse
  for (const o of BYTYPE.cassa) {
    o.q = [o.sp.service.slice()];
    for (let k = 1; k <= 6; k++) { const tx = o.sp.service[0], ty = o.sp.service[1] - k; const t = T(tx, ty); if (!t || !walkable(tx, ty) || !inBuilding(tx, ty) || (t.res && t.res !== -1)) break; o.q.push([tx, ty]); }
  }
  // campo decorazioni
  DECOR.fill(0);
  for (const o of objs) {
    const dv = OBJS[o.type].decor; if (!dv) continue;
    for (let y = o.y - 4; y <= o.y + 4; y++) for (let x = o.x - 4; x <= o.x + 4; x++) { if (!T(x, y)) continue; const d = Math.hypot(x - o.x, y - o.y); if (d <= 4) DECOR[y * MW + x] += dv * (1 - d / 5); }

}
function categories() { return PROD_KEYS.filter(k => SHELVES[k] && SHELVES[k].length).length; }
function totalDecor() { let s = 0; for (const o of objs) s += OBJS[o.type].decor || 0; return s; }

const PANTS = ['#2d3b55', '#3a3a3a', '#5a4632', '#2f5e3a', '#6b6b6b', '#1f2a44'];
function randLook(role) {
  const age = role ? 'adult' : (Math.random() < .12 ? 'kid' : Math.random() < .2 ? 'old' : 'adult');
  return {
    skin: pick(SKINS), hair: age === 'old' ? pick(['#d0d0d0', '#e8e8e8', '#a8a8a8']) : pick(HAIRS.slice(0, 6)),
    shirt: role ? ROLES[role].col : pick(SHIRTS), pants: pick(PANTS), age,
    h: age === 'kid' ? -4 : age === 'old' ? -1 : ri(-1, 1), long: Math.random() < .4, bag: Math.random() < .3,
  };
}
function mkPerson(kind, x, y, extra) {
  const p = Object.assign({ id: nextId++, kind, x, y, path: [], dest: null, state: 'arrive', t: 0, anim: Math.random(), dir: [0, 1], moving: false, thought: null, envT: Math.random() }, extra || {});
  if (!p.look) p.look = randLook(kind === 'cliente' ? null : kind);
  people.push(p); pmap.set(p.id, p); return p;
}
function setDest(p, tx, ty) {
  const sx = Math.round(p.x), sy = Math.round(p.y);
  const path = findPath(clamp(sx, 0, MW - 1), clamp(sy, 0, MH - 1), tx, ty);
  if (!path) return false;
  if (!path.length && (Math.abs(p.x - tx) > .01 || Math.abs(p.y - ty) > .01)) path.push([tx, ty]);
  p.path = path; p.dest = [tx, ty]; return true;
}
function speedOf(p) {
  if (p.kind === 'cliente') { let s = p.look.age === 'old' ? 1.15 : p.look.age === 'kid' ? 1.9 : 1.6; if (p.state === 'escape') s = 2.1; return s * p.spd; }
  let s = ROLES[p.kind].sp * (0.8 + p.skill * 0.06);
  if (p.energy < 10) s *= .6;
  if (p.state === 'chase') s *= 1.25;
  return s;
}
// 1 = arrivato, 0 = in cammino, -1 = bloccato

function faceItems(f, len, frac, prod, seed, rows) {

  let k = 0;

    if (k >= filled) return;
    const [sx, sy] = f((i + .5) / n, z);
    const col = cols[(i * 7 + seed + rows.indexOf(z) * 3) % cols.length];
    if (shape === 'bottle') { rect(sx - 1, sy - 5, 2, 5, col); rect(sx - .5, sy - 6, 1, 1, sh('#888888', 1)); }
    else if (shape === 'tall') { rect(sx - 1, sy - 5, 2, 5, col); rect(sx - 1, sy - 5, 2, 1, '#ffffff'); }
    else if (shape === 'can') { rect(sx - 1, sy - 3, 2, 3, col); rect(sx - 1, sy - 6, 2, 3, cols[(i + 1) % cols.length]); }

// ---------- persone ----------
function drawPerson(p, scale) {
  const [sx, sy] = P(p.x, p.y);
  const L = p.look, x = Math.round(sx), y = Math.round(sy) + 1;
  const step = p.moving ? (Math.floor(p.anim * 7) % 2) : 2;
  const H = L.h, kid = L.age === 'kid';
  const scr = [(p.dir[0] - p.dir[1]), (p.dir[0] + p.dir[1]) * .5];
  const front = scr[1] >= -0.05;
  ell(x, y, kid ? 3 : 4, 1.5, 'rgba(0,0,0,.3)');
  // carrello
  let cartFront = false, cx = 0, cy = 0;
  if (p.cart) { const n = Math.hypot(scr[0], scr[1]) || 1; cx = Math.round(x + scr[0] / n * 7); cy = Math.round(y + scr[1] / n * 5); cartFront = cy >= y; if (!cartFront) drawCart(cx, cy, p); }
  const legH = kid ? 3 : 5;
  rect(x - 2, y - legH - (step === 0 ? 1 : 0), 2, legH, L.pants);
  rect(x, y - legH - (step === 1 ? 1 : 0), 2, legH, L.pants);
  rect(x - 2, y - 1, 2, 1, '#1a1a1a'); rect(x, y - 1, 2, 1, '#1a1a1a');
  const top = y - legH;
  const bodyH = (kid ? 4 : 6) + Math.max(0, H);
  let shirt = L.shirt;
  rect(x - 3, top - bodyH, 6, bodyH, shirt);
  rect(x - 3, top - bodyH, 1, bodyH, sh(shirt.length === 7 ? shirt : '#888888', 1.15));
  // braccia
  const armSw = p.moving ? (step ? 1 : -1) : 0;
  rect(x - 4, top - bodyH + 1 + armSw, 1, 4, sh(shirt, .85)); rect(x + 3, top - bodyH + 1 - armSw, 1, 4, sh(shirt, .85));
  rect(x - 4, top - bodyH + 5 + armSw, 1, 1, L.skin); rect(x + 3, top - bodyH + 5 - armSw, 1, 1, L.skin);
  // dettagli divisa
  if (p.kind === 'cassiere') { rect(x - 1, top - bodyH, 2, 2, '#f4ead0'); rect(x + 1, top - bodyH + 3, 1, 1, '#f0b43a'); }
  if (p.kind === 'magazziniere') { rect(x - 2, top - bodyH + 2, 1, bodyH - 2, '#1f4a7a'); rect(x + 1, top - bodyH + 2, 1, bodyH - 2, '#1f4a7a'); }
  if (p.kind === 'pulizie') { rect(x - 3, top - 2, 6, 1, '#f0c419'); }
  if (p.kind === 'vigilante') { rect(x - 3, top - 1, 6, 1, '#111111'); rect(x + 1, top - bodyH + 1, 1, 1, '#f0b43a'); }
  // testa
  const hy = top - bodyH - 4;
  rect(x - 2, hy, 4, 4, L.skin);
  if (front) { rect(x - 1, hy + 2, 1, 1, '#2a1a10'); rect(x + 1, hy + 2, 1, 1, '#2a1a10'); }
  rect(x - 2, hy - 1, 4, 2, L.hair);
  if (!front) rect(x - 2, hy, 4, 3, L.hair);
  if (L.long && p.kind === 'cliente') { rect(x - 3, hy, 1, 4, L.hair); rect(x + 2, hy, 1, 4, L.hair); }
  if (p.kind === 'vigilante') { rect(x - 3, hy - 2, 6, 2, '#111a2a'); rect(x - 3, hy, 7, 1, '#111a2a'); }
  if (p.kind === 'cassiere') { rect(x - 2, hy - 2, 4, 1, '#c8372d'); }
  // oggetti in mano
  if (p.carry) { rect(x - 3, top - bodyH + 1, 7, 5, '#b88a52'); rect(x - 3, top - bodyH + 3, 7, 1, '#8c5a2b'); }
  if (p.kind === 'pulizie' && (p.state === 'clean' || p.state === 'toLitter')) { line([x + 4, top - bodyH + 2], [x + 7, y], '#a0642a'); rect(x + 6, y - 1, 3, 2, '#e8e2d0'); }
  if (p.kind === 'cliente' && L.bag && !p.cart && p.units > 0) rect(x + 3, top - 2, 3, 4, '#e8e2d0');
  if (p.state === 'rest') rect(x - 3, top - bodyH - 6, 6, 1, 'rgba(255,255,255,0)');
  if (p.cart && cartFront) drawCart(cx, cy, p);
}

  }

  const nCars = Math.min(SPOTS.length, Math.ceil(customersInside() * .45));

    const h = [P(X1 + .5, Y1 + .5, 0), P(X0 - .5, Y1 + .5, 0), P(X0 - .5, Y1 - .5, 7), P(X0 - .5, Y1 - .5, WH), P(X0 - .5, Y0 - .5, WH), P(X1 + .5, Y0 - .5, WH), P(X1 + .5, Y0 + .5, WH), P(X1 + .5, Y0 + .5, 7)];

    C.globalCompositeOperation = 'lighter';
    for (const [x, y] of LAMPS) { const [lx, ly] = P(x, y); const g = C.createRadialGradient(lx, ly, 2, lx, ly, 46); g.addColorStop(0, `rgba(255,200,120,${(night * .28).toFixed(3)})`); g.addColorStop(1, 'rgba(255,200,120,0)'); C.fillStyle = g; C.fillRect(lx - 46, ly - 46, 92, 92); }
    const [dx, dy] = P(15.5, Y1 + 1.2); const g = C.createRadialGradient(dx, dy, 2, dx, dy, 40); g.addColorStop(0, `rgba(255,240,200,${(night * .25).toFixed(3)})`); g.addColorStop(1, 'rgba(255,240,200,0)'); C.fillStyle = g; C.fillRect(dx - 40, dy - 40, 80, 80);
    C.globalCompositeOperation = 'source-over';

  // selezione
  if (ui.sel) {
    if (ui.sel.k === 'o') { const o = objMap.get(ui.sel.id); if (o) for (const [x, y] of o.tiles) diamond(x, y, 'rgba(240,180,58,.18)', '#f0b43a'); }
    else { const p = pmap.get(ui.sel.id); if (p) { const [sx, sy] = P(p.x, p.y); const b = Math.round(Math.sin(performance.now() / 160) * 1.5); const ty = Math.round(sy) - 30 + b; poly([[sx - 3, ty], [sx + 3, ty], [sx, ty + 4]], '#f0b43a', OUTL); } }
  }
  // fantasma di costruzione
  if (ui.build && ui.hover) {

    const ok = ui.hoverOK && ui.hoverOK.ok;
    for (const [x, y] of tiles) if (T(x, y)) diamond(x, y, ok ? 'rgba(134,201,90,.35)' : 'rgba(226,88,59,.4)', ok ? '#86c95a' : '#e2583b');
    const sp = special(ui.build, hx, hy);

  } else if (ui.sell && ui.hover) {
    const t = T(...ui.hover); if (t && t.obj) { const o = objMap.get(t.obj); for (const [x, y] of o.tiles) diamond(x, y, 'rgba(226,88,59,.35)', '#e2583b'); }

function resize() {

  clampCam();
}
function centerCam() {
  OX = MAPOX; OY = MAPOY;
  const [sx, sy] = P((X0 + X1) / 2 + 1, (Y0 + Y1) / 2 + 2.5);
  cam.x = cv.width / 2 - sx; cam.y = cv.height / 2 - sy + 6;
  clampCam();
}
function clampCam() {
  const W = cv.width, H = cv.height;

  cam.y = clamp(cam.y, H * .5 - cache.height, H * .5);

function toBuf(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height]; }
function bufToTile(bx, by) {
  const u = (bx - (MAPOX + Math.round(cam.x))) / 16, v = (by - (MAPOY + Math.round(cam.y))) / 8;
  return [Math.round((u + v) / 2), Math.round((v - u) / 2)];
}
function personAt(bx, by) {

  let best = null, bk = -1;
  for (const p of people) { const [sx, sy] = P(p.x, p.y); if (bx >= sx - 5 && bx <= sx + 5 && by >= sy - 18 && by <= sy + 2) { const k = p.x + p.y; if (k > bk) { bk = k; best = p; } } }
  return best;
}
function objAtScreen(bx, by) {
  // prova anche più in alto per gli oggetti alti
  for (let dz = 0; dz <= 24; dz += 6) { const [tx, ty] = bufToTile(bx, by + dz); const t = T(tx, ty); if (t && t.obj) return objMap.get(t.obj); }
  return null;
}
let drag = null;

cv.addEventListener('pointerdown', e => {

cv.addEventListener('pointermove', e => {

  const dtR = Math.min(.1, (now - last) / 1000); last = now;
  panKeys(dtR);
  if (!S.paused && !ui.pause && !S.over) {
    let sim = dtR * SPD[S.speed];
    while (sim > 0) { const st = Math.min(.05, sim); step(st); sim -= st; }
  }
  // porte automatiche
  const near = people.some(p => Math.abs(p.y - (Y1 - .2)) < 1.4 && p.x > DOORX[0] - 1.2 && p.x < DOORX[1] + 1.2);
  doorOpen = clamp(doorOpen + (near ? dtR * 4 : -dtR * 2), 0, 1);
  render();
  uiAcc += dtR;
  if (uiAcc > .25) { uiAcc = 0; topbar(); infoLive(); if (ui.cat) refreshTray(); }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { resize(); placeHint(); });

function start(data) {
  try { sfxOn = localStorage.getItem('spesapazza_audio') !== '0'; } catch (e) {}
  $('#sound').classList.toggle('on', sfxOn);
  resize();
  if (data && data.save) { load(data.save); } else { newGame(); }
  centerCam();
  if (!(data && data.save)) welcome();
  document.fonts && document.fonts.load('8px Silkscreen').then(() => { cacheDirty = true; }).catch(() => {});
  window.claude?.hot?.snapshot?.(() => ({ save: serialize() }));
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.__spesa = { get S() { return S; }, step, people: () => people, objs: () => objs, placeObj, canPlace, hire: (r) => hire(r, genCand(r)), setSpeed, closeWin, serialize, load };
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
